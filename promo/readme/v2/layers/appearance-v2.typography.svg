<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080"><defs><filter id="shadow" x="-40%" y="-60%" width="180%" height="240%"><feDropShadow dx="0" dy="14" stdDeviation="15" flood-color="#173654" flood-opacity=".24"/></filter><filter id="lightBlur"><feGaussianBlur stdDeviation="24"/></filter><radialGradient id="spot"><stop stop-color="#ffffff" stop-opacity=".95"/><stop offset=".55" stop-color="#f7fdff" stop-opacity=".65"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient><linearGradient id="colorScene" x2="1" y2="1"><stop stop-color="#a2dcf4"/><stop offset=".45" stop-color="#c2c4ee"/><stop offset="1" stop-color="#f0c6d6"/></linearGradient><linearGradient id="pale" x2="1" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#e7f0fb"/></linearGradient><linearGradient id="dark" x2="1" y2="1"><stop stop-color="#0a1829"/><stop offset="1" stop-color="#18364c"/></linearGradient><linearGradient id="glass" x2=".7" y2="1"><stop stop-color="#ffffff" stop-opacity=".62"/><stop offset="1" stop-color="#edf5ff" stop-opacity=".35"/></linearGradient></defs><text x="70" y="126" fill="#f1f7ff" font-family="Microsoft YaHei UI, Segoe UI, sans-serif" font-size="64" font-weight="700">两个面板，一起换个外观。</text><text x="76" y="192" fill="#b5cce1" font-family="Microsoft YaHei UI, Segoe UI, sans-serif" font-size="27" font-weight="400">在设置中开启材质同步，让系统隐藏区与收纳面板采用对应外观。</text><text x="106" y="339" fill="#102b46" font-family="Microsoft YaHei UI, Segoe UI, sans-serif" font-size="36" font-weight="700">浅色</text><text x="842" y="339" fill="#edf5ff" font-family="Microsoft YaHei UI, Segoe UI, sans-serif" font-size="36" font-weight="700">深色</text><text x="842" y="602" fill="#b6daff" font-family="Microsoft YaHei UI, Segoe UI, sans-serif" font-size="29" font-weight="600">亚克力 · 随背景透光</text><text x="77" y="954" fill="#eff6ff" font-family="Microsoft YaHei UI, Segoe UI, sans-serif" font-size="31" font-weight="600">关闭同步或退出，恢复系统原背景。</text><text x="77" y="1010" fill="#99b4ce" font-family="Microsoft YaHei UI, Segoe UI, sans-serif" font-size="21" font-weight="400">左侧底部为当前设置界面；材质组合为示意，透光细节随背景与系统设置变化。</text></svg>