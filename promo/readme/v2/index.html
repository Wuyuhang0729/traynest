<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TrayNest · 图标多，也能管理</title><style>*{box-sizing:border-box}body{margin:0;color:#102b46;background:#f5f8fc;font:16px 'Microsoft YaHei UI','Segoe UI',sans-serif}header,main,footer{max-width:1100px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:16px}header strong{display:flex;align-items:center;gap:10px;font-size:22px}header img{width:32px;height:32px}a{color:#1865da;text-decoration:none}.download{background:#1865da;color:white;border-radius:24px;padding:12px 20px;white-space:nowrap}.hero{width:100%;display:block;border-radius:22px}.intro{font-size:21px;line-height:1.8;margin:28px 0 40px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}article{background:white;border:1px solid #e3eaf2;border-radius:22px;overflow:hidden}article img{width:100%;display:block}article h2{font-size:22px;margin:22px 24px 8px}article p{color:#526d88;margin:0 24px 24px;line-height:1.7}footer{color:#526d88;line-height:1.9;padding-bottom:50px}@media(max-width:650px){header,main,footer{padding:16px}header strong{font-size:18px}.download{padding:10px 14px;font-size:14px}.intro{font-size:17px}.grid{grid-template-columns:1fr;gap:16px}article h2{font-size:20px}.hero{border-radius:14px}}</style></head><body><header><strong><img src="assets/traynest.png" alt="">TrayNest</strong><a class="download" href="https://github.com/Wuyuhang0729/traynest/releases/tag/v0.2.0-preview.12">下载预览版</a></header><main><img class="hero" src="../../../assets/readme/hero-v2.png" alt="TrayNest：图标多，也能管理"><p class="intro">从系统隐藏区挑一组图标，单独收好。位置记得住，展开按习惯，外观也统一。</p><div class="grid"><article><h2>拖进来，排顺手</h2><img src="../../../assets/readme/organize-detail.png" alt="拖进来，排顺手"><p>拖入收纳，拖动排序，拖出移回。</p></article><article><h2>重启电脑，布局不变</h2><img src="../../../assets/readme/remember-detail.png" alt="重启电脑，布局不变"><p>未启动，也可点击打开。</p></article><article><h2>展开方式，三选一</h2><img src="../../../assets/readme/expansion-detail.png" alt="展开方式，三选一"><p>手动、跟随隐藏区或悬停入口。</p></article><article><h2>两个面板，材质统一</h2><img src="../../../assets/readme/material-detail.png" alt="两个面板，材质统一"><p>浅色、深色、亚克力，按习惯选。</p></article><article><h2>原来的操作，照常使用</h2><img src="../../../assets/readme/interaction-detail.png" alt="原来的操作，照常使用"><p>单击、双击和右键菜单。</p></article><article><h2>展开位置，由你决定</h2><img src="../../../assets/readme/placement-detail.png" alt="展开位置，由你决定"><p>左侧或上方，按边缘对齐。</p></article></div></main><footer>Windows 11 x64 · 开源预览版。完整解压后双击 Install.cmd，从桌面打开即可。<br><a href="https://github.com/Wuyuhang0729/traynest">GitHub 与使用说明</a> · <a href="CREDITS.md">可编辑图层与素材来源</a></footer></body></html>
