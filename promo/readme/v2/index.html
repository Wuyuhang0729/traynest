<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="TrayNest：从系统隐藏区挑一组图标，单独收好。支持拖动排序、布局记忆、按习惯展开与双面板材质同步。"><title>TrayNest · 图标多，也能管理</title><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f1f5fa;color:#102b46;font:16px 'Microsoft YaHei UI','Segoe UI',sans-serif}header{max-width:1280px;margin:auto;padding:24px;display:flex;align-items:center;justify-content:space-between;gap:20px}header strong{display:flex;align-items:center;gap:10px;font-size:20px}header img{width:32px;height:32px}nav{display:flex;gap:20px;align-items:center}a{color:#1865da;text-decoration:none}.download{background:#1865da;color:white;padding:12px 20px;border-radius:24px}main{max-width:1280px;margin:auto}figure{margin:0 0 32px;background:white;border-radius:24px;overflow:hidden;box-shadow:0 12px 45px #142e4d0b}figure>img{width:100%;height:auto;display:block}figcaption{padding:16px 28px;color:#526d88;font-size:14px;display:flex;justify-content:space-between;gap:20px}footer{max-width:1280px;padding:24px 28px 60px;margin:auto;color:#526d88;line-height:1.9}footer strong{color:#102b46}@media(max-width:700px){header{padding:16px}nav{gap:12px;font-size:13px}.source{display:none}main{padding:0 8px}figure{border-radius:14px;margin-bottom:16px}figcaption{padding:12px 16px;font-size:12px}figcaption span{display:none}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}</style></head><body><header><strong><img src="assets/traynest.png" alt="">TrayNest</strong><nav><a class="source" href="https://github.com/Wuyuhang0729/traynest">GitHub</a><a href="#install">如何安装</a><a class="download" href="https://github.com/Wuyuhang0729/traynest/releases/tag/v0.2.0-preview.12">下载预览版</a></nav></header><main><figure><img fetchpriority="high" src="../../../assets/readme/hero-v2.png" alt="图标多，也能管理：TrayNest · Windows 11 图标面板管理工具"><figcaption><span>TrayNest · Windows 11 图标面板管理工具</span><a href="layers/hero-v2.svg">可编辑 SVG ↗</a></figcaption></figure><figure><img loading="lazy" src="../../../assets/readme/workflow-v2.png" alt="给隐藏区再添一个自选空间：同一组图标的收纳前后对比"><figcaption><span>同一组图标的收纳前后对比</span><a href="layers/workflow-v2.svg">可编辑 SVG ↗</a></figcaption></figure><figure><img loading="lazy" src="../../../assets/readme/control-v2.png" alt="记住布局，按习惯展开：当前生产控件演示与独立设置窗口"><figcaption><span>当前生产控件演示与独立设置窗口</span><a href="layers/control-v2.svg">可编辑 SVG ↗</a></figcaption></figure><figure><img loading="lazy" src="../../../assets/readme/appearance-v2.png" alt="统一两个面板的外观：浅色、深色与亚克力材质示意"><figcaption><span>浅色、深色与亚克力材质示意</span><a href="layers/appearance-v2.svg">可编辑 SVG ↗</a></figcaption></figure></main><footer id="install"><strong>Windows 11 x64 · 开源预览版</strong><p>下载并完整解压，双击 Install.cmd。安装后从桌面打开 TrayNest，把想收纳的图标拖进面板。无需另外安装 .NET，默认不开启开机启动。</p><p>右键入口 → 设置。可选择展开方式，调整左侧／上方位置、5–8 列及材质。材质同步关闭后恢复系统原背景。</p><p>当前在 Windows 11 25H2 验证；第三方图标为公开演示素材，不代表逐项兼容认证。<a href="../../../docs/COMPATIBILITY.md">兼容性说明</a> · <a href="CREDITS.md">图层与素材说明</a> · <a href="https://github.com/Wuyuhang0729/traynest/issues/new?template=bug_report.yml">反馈问题</a></p></footer></body></html>
