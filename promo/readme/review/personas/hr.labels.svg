<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1820" viewBox="0 0 1080 1820"><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f7f9ff"/><stop offset="1" stop-color="#e9f0fc"/></linearGradient><filter id="shadow" x="-25%" y="-35%" width="150%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#283e68" flood-opacity=".13"/></filter><clipPath id="customClip"><rect x="250" y="1260" width="660" height="279" rx="20" fill="white" stroke="none"/></clipPath></defs><text x="60" y="65" text-anchor="start" font-family="Microsoft YaHei UI,Segoe UI" font-size="25" fill="#74839b" font-weight="400">人事部门职员 · 一种个人安排</text><text x="60" y="126" text-anchor="start" font-family="Microsoft YaHei UI,Segoe UI" font-size="43" fill="#15253f" font-weight="700">沟通留在眼前，</text><text x="60" y="183" text-anchor="start" font-family="Microsoft YaHei UI,Segoe UI" font-size="43" fill="#15253f" font-weight="700">资料工具收在一起。</text><text x="62" y="238" text-anchor="start" font-family="Microsoft YaHei UI,Segoe UI" font-size="25" fill="#6c7f9c" font-weight="400">任务栏空间有限，给图标多一种安排。</text><circle cx="87" cy="348" r="31" fill="#dce5f2"/><text x="87" y="359" text-anchor="middle" font-family="Microsoft YaHei UI,Segoe UI" font-size="30" fill="#48627f" font-weight="700">1</text><circle cx="87" cy="698" r="31" fill="#dce5f2"/><text x="87" y="709" text-anchor="middle" font-family="Microsoft YaHei UI,Segoe UI" font-size="30" fill="#48627f" font-weight="700">2</text><circle cx="87" cy="1178" r="31" fill="#2563eb"/><text x="87" y="1189" text-anchor="middle" font-family="Microsoft YaHei UI,Segoe UI" font-size="30" fill="white" font-weight="700">3</text><text x="184" y="357" text-anchor="start" font-family="Microsoft YaHei UI,Segoe UI" font-size="37" fill="#243b5b" font-weight="700">最重要</text><rect x="838" y="321" width="135" height="39" rx="12" fill="#edf2f9" stroke="none"/><text x="905.5" y="348" text-anchor="middle" font-family="Microsoft YaHei UI,Segoe UI" font-size="21" fill="#5e7290" font-weight="500">任务栏</text><text x="184" y="402" text-anchor="start" font-family="Microsoft YaHei UI,Segoe UI" font-size="25" fill="#657b98" font-weight="400">候选人与内部沟通</text><text x="184" y="555" text-anchor="start" font-family="Microsoft YaHei UI,Segoe UI" font-size="22" fill="#617594" font-weight="400">2 个应用 · 微信 · 企业微信</text><text x="184" y="707" text-anchor="start" font-family="Microsoft YaHei UI,Segoe UI" font-size="37" fill="#243b5b" font-weight="700">次要重要</text><rect x="792" y="671" width="181" height="39" rx="12" fill="#edf2f9" stroke="none"/><text x="882.5" y="698" text-anchor="middle" font-family="Microsoft YaHei UI,Segoe UI" font-size="21" fill="#5e7290" font-weight="500">系统隐藏区</text><text x="184" y="752" text-anchor="start" font-family="Microsoft YaHei UI,Segoe UI" font-size="25" fill="#657b98" font-weight="400">其他沟通与安全</text><text x="184" y="1032" text-anchor="start" font-family="Microsoft YaHei UI,Segoe UI" font-size="22" fill="#54759f" font-weight="400">4 个入口 · 点 TrayNest，展开下面的自选面板 ↓</text><text x="184" y="1187" text-anchor="start" font-family="Microsoft YaHei UI,Segoe UI" font-size="37" fill="#2563eb" font-weight="700">个人筛选</text><rect x="792" y="1151" width="181" height="39" rx="12" fill="#dbeaff" stroke="none"/><text x="882.5" y="1178" text-anchor="middle" font-family="Microsoft YaHei UI,Segoe UI" font-size="21" fill="#2563eb" font-weight="500">TrayNest</text><text x="184" y="1232" text-anchor="start" font-family="Microsoft YaHei UI,Segoe UI" font-size="25" fill="#4b75ae" font-weight="400">资料、截图与输入 · 3 个应用</text><text x="184" y="1581" text-anchor="start" font-family="Microsoft YaHei UI,Segoe UI" font-size="23" fill="#54759f" font-weight="400">百度网盘 · Snipaste · 搜狗输入法设置</text><text x="60" y="1720" text-anchor="start" font-family="Microsoft YaHei UI,Segoe UI" font-size="26" fill="#395878" font-weight="600">第 3 层由你挑选，内外都按自己的习惯安排。</text><text x="60" y="1764" text-anchor="start" font-family="Microsoft YaHei UI,Segoe UI" font-size="20" fill="#7b8ca5" font-weight="400">示例比例 2 : 4 : 3；系统隐藏区的数量包含 TrayNest 入口。</text></svg>