<svg xmlns="http://www.w3.org/2000/svg" width="880" height="488" viewBox="0 0 880 488" role="img" aria-labelledby="title desc"><title id="title">多种打开方式</title><desc id="desc">点击入口、跟随系统面板或悬停展开。全局快捷键可更改或清除。项目原创界面图，非实机截图。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#edf3fb"/></linearGradient><linearGradient id="glass" x2="1" y2="1"><stop stop-color="#f8fcff" stop-opacity=".96"/><stop offset="1" stop-color="#dbe8f7" stop-opacity=".9"/></linearGradient><linearGradient id="hero" x2="1" y2="1"><stop stop-color="#0c1c35"/><stop offset="1" stop-color="#173d64"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="m1 1 7 4-7 4" fill="none" stroke="#4e84ef" stroke-width="1.6"/></marker></defs><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><rect x="1" y="1" width="878" height="486" rx="22" fill="#ffffff" stroke="#d7e0eb"/><rect x="36" y="30" width="54" height="46" rx="10" fill="#eff4fa" stroke="none"/><text x="47" y="62" font-size="25" fill="#b45309" font-weight="650">04</text><text x="110" y="65" font-size="35" fill="#172b4d" font-weight="650">多种打开方式</text><text x="36" y="111" font-size="25" fill="#5b6d83" font-weight="400">点击入口、跟随系统面板或悬停展开</text><path d="M36 132h808" stroke="#e5ebf2"/><rect x="36" y="152" width="808" height="304" rx="14" fill="#f7f9fc" stroke="none"/><g transform="translate(36 152)"><rect x="24" y="24" width="478" height="74" rx="12" fill="#fff" stroke="#dce5ef"/><text x="42" y="54" font-size="25" fill="#244b7e" font-weight="600">手动打开（默认）</text><text x="42" y="83" font-size="22" fill="#60748e" font-weight="400">点击入口或使用快捷键</text><rect x="24" y="112" width="478" height="74" rx="12" fill="#fff" stroke="#dce5ef"/><text x="42" y="142" font-size="25" fill="#244b7e" font-weight="600">跟随系统面板</text><text x="42" y="171" font-size="22" fill="#60748e" font-weight="400">仅联动模式可选</text><rect x="24" y="200" width="478" height="74" rx="12" fill="#fff" stroke="#dce5ef"/><text x="42" y="230" font-size="25" fill="#244b7e" font-weight="600">悬停入口</text><text x="42" y="259" font-size="22" fill="#60748e" font-weight="400">停留约半秒后展开</text><text x="549" y="72" font-size="23" fill="#34455e" font-weight="400">全局快捷键</text><rect x="546" y="108" width="94" height="68" rx="12" fill="#fff" stroke="#c6d6ea"/><rect x="684" y="108" width="94" height="68" rx="12" fill="#fff" stroke="#c6d6ea"/><text x="565" y="154" font-size="34" fill="#315c92" font-weight="600">Alt</text><text x="653" y="153" font-size="29" fill="#8a9ab0" font-weight="400">+</text><text x="718" y="154" font-size="34" fill="#315c92" font-weight="600">D</text><text x="549" y="224" font-size="23" fill="#34455e" font-weight="400">默认 Alt+D</text></g></g></svg>
