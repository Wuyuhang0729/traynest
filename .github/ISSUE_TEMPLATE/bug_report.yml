name: 问题反馈
description: 报告托盘图标、菜单、拖放或程序错误
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        请右键 TrayNest 入口打开“诊断与反馈…”，复制或导出报告。
        Issue 内容会公开展示，请检查报告和截图后再提交。没有错误编号也可以反馈。
  - type: input
    id: version
    attributes:
      label: TrayNest 版本
      placeholder: 例如 0.2.0-preview.1，可从诊断报告查看
    validations:
      required: true
  - type: input
    id: error_code
    attributes:
      label: 错误编号与事件 ID
      placeholder: 例如 TN3001 / 事件 ID，或填写“没有错误提示”
  - type: input
    id: affected_app
    attributes:
      label: 涉及的软件
      description: 填写软件名称与版本即可，不需要完整安装路径。
  - type: textarea
    id: steps
    attributes:
      label: 如何复现
      placeholder: |
        1. 打开……
        2. 点击或拖动……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: 预期结果与实际结果
      placeholder: 原本希望发生什么，实际发生了什么？是否每次都出现？
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 诊断报告
      description: 粘贴复制的报告，或在下方附上导出的文件。程序无法启动时，可附错误对话框信息。
      render: json
  - type: textarea
    id: screenshots
    attributes:
      label: 补充信息或截图
      description: 可补充 Windows 版本、屏幕缩放、显示器数量和截图。
